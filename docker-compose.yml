services:
  web:
    build: .
    ports:
      - "5173:5173"
    volumes:
      # Mount current directory so changes are reflected immediately
      - .:/app
      # Preserve node_modules in container (don't overwrite with host's)
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true

